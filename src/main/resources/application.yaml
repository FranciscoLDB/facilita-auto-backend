spring:
  application:
    name: facilita-auto-backend

  # Define o perfil 'dev' como ativo por padrão
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Formatação Padrão de JSON na API
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

# Propriedades genéricas do sistema
app:
  tenant:
    header-name: X-Tenant-ID
  security:
    admin-api-key: ${ADMIN_API_KEY:very-very-secret-key}
    jwt-secret: ${JWT_SECRET:very-secret-loooooooooooooooooooooooooooooong-random-value}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}