server:
  port: 8080

spring:
  # Conexão com o PostgreSQL Local no Docker
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # Configuração do Flyway para Dev
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 5   # <-- Informa ao Flyway que o banco já está na V5

  # Configuração do JPA / Hibernate para Dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Log detalhado para depuração local
logging:
  level:
    root: INFO
    com.fldb.facilitaautobackend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE